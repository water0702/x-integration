main.datasource.url = jdbc:hsqldb:file:.jmix/hsqldb/INTEG
main.datasource.username = sa
main.datasource.password =

main.liquibase.change-log=com/x/integration/liquibase/changelog.xml

jmix.ui.login-view-id = INTEG_LoginView
jmix.ui.main-view-id = INTEG_MainView
jmix.ui.menu-config = com/x/integration/menu.xml
jmix.ui.composite-menu = true

ui.login.defaultUsername = admin
ui.login.defaultPassword = admin

jmix.core.available-locales = en,zh_CN

jmix.core.skip-null-or-empty-conditions-by-default=true
jmix.appsettings.check-permissions-for-app-settings-entity=true
jmix.ui.view.prevent-browser-tab-closing=true
spring.main.allow-circular-references=true
# Launch the default browser when starting the application in development mode
vaadin.launch-browser = false

# Use pnpm to speed up project initialization and save disk space
vaadin.pnpm.enable = true

logging.level.org.atmosphere = warn

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql = info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore = info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger = debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix = info
server.servlet.context-path=/integration
server.port=8880

# The client id is integration-client
spring.security.oauth2.authorizationserver.client.integration.registration.client-id=integration-client
# The client secret (password) is integration-client
spring.security.oauth2.authorizationserver.client.integration.registration.client-secret={noop}integration-secret
# Enable Client Credential grant for the integration-client
spring.security.oauth2.authorizationserver.client.integration.registration.authorization-grant-types=client_credentials
# Client credentials must be passed in the Authorization header using the HTTP Basic authentication scheme
spring.security.oauth2.authorizationserver.client.integration.registration.client-authentication_methods=client_secret_basic
# Use opaque tokens instead of JWT
spring.security.oauth2.authorizationserver.client.integration.token.access-token-format=reference